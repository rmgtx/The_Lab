<style>
/* Layout: one centered library column; a responsive grid of specimen cards, each a light stage + meta + copy actions + collapsible code. */
:root{
  --bg:#F3F3F0; --surface:#FFFFFF; --line:#E0E0DB; --fg:#0A0A0A; --muted:#5C5C56;
  --accent:#2F45FF; --accent-ink:#FFFFFF; --stage:#EEEEEB; --code-bg:#F7F7F5; --toast-bg:#0A0A0A; --toast-fg:#FFFFFF;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121211; --surface:#1B1B19; --line:#2E2E2B; --fg:#EDEDEA; --muted:#A3A39C;
    --accent:#8C9BFF; --accent-ink:#0A0A0A; --stage:#ECECE8; --code-bg:#151513; --toast-bg:#EDEDEA; --toast-fg:#0A0A0A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121211; --surface:#1B1B19; --line:#2E2E2B; --fg:#EDEDEA; --muted:#A3A39C;
  --accent:#8C9BFF; --accent-ink:#0A0A0A; --stage:#ECECE8; --code-bg:#151513; --toast-bg:#EDEDEA; --toast-fg:#0A0A0A;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding-block:12px 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:40px}
@media (min-width:720px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 32px}
header.top h1{margin:0;font-size:clamp(36px,6vw,56px);line-height:1;font-weight:600;letter-spacing:-.04em;text-wrap:balance}
header.top p{margin:12px 0 0;max-width:60ch;color:var(--muted);font-size:17px}
.count{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:20px}
.card{min-width:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.stage{background:var(--stage);min-height:220px;display:grid;place-items:center;padding:32px 16px;border-bottom:1px solid var(--line)}
.meta{display:flex;flex-direction:column;gap:4px;padding:18px 20px 0}
.meta .row{display:flex;align-items:baseline;gap:10px}
.meta .no{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.palette{position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 72px);right:max(16px,calc((100vw - 1320px) / 2 + 40px));
  width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 96px);overflow:auto;box-sizing:border-box;
  display:flex;flex-direction:column;gap:14px;padding:16px 18px 18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);
  box-shadow:0 28px 60px -28px color-mix(in srgb,var(--fg) 55%,transparent)}
.pal-head{display:flex;align-items:center;justify-content:space-between}
.pal-title{font-weight:600;font-size:15px;letter-spacing:-.01em}
.pal-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-width:0}
.pal-label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swg{display:inline-flex;align-items:center;height:44px;padding-right:4px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.swg.locked{border-color:var(--fg)}
.sw{display:inline-flex;align-items:center;gap:10px;height:100%;padding:0 6px;border-radius:12px;cursor:pointer}
.lock{appearance:none;width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.lock svg{width:15px;height:15px}
.lock:hover{color:var(--fg);background:var(--bg)}
.lock[aria-pressed="true"]{color:var(--fg);background:var(--bg)}
.lock:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.act.dice svg{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.act.dice.roll svg{transform:rotate(360deg)}
.sw input{width:32px;height:32px;border:0;padding:0;border-radius:8px;background:none;cursor:pointer;flex:none}
.sw input::-webkit-color-swatch-wrapper{padding:0}
.sw input::-webkit-color-swatch{border:1px solid var(--line);border-radius:8px}
.sw input::-moz-color-swatch{border:1px solid var(--line);border-radius:8px}
.sw b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.sw code{display:block;font-family:var(--mono);font-size:11px;line-height:1.3;color:var(--muted)}
.sw:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.preset{appearance:none;font:inherit;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 8px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.preset:hover{border-color:var(--muted)}
.preset[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.preset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.preset .dots{display:inline-flex}
.preset .dots i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1.5px var(--surface);margin-left:-4px}
.preset .dots i:first-child{margin-left:0}
.pal-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:10px 20px;width:100%;padding-top:10px;border-top:1px solid var(--line)}
.jump{display:flex;flex-wrap:wrap;gap:2px}
.jump a{font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px}
.jump a:hover{color:var(--fg);background:var(--surface)}
.jump a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.base-opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.switch input{width:16px;height:16px;margin:0;accent-color:var(--fg)}
.group{scroll-margin-top:76px}
@media (max-width:650px){.palette{left:16px;right:16px;width:auto;top:calc(env(safe-area-inset-top,0px) + 64px)}}
.offscreen *,.offscreen *::before,.offscreen *::after{animation-play-state:paused !important}
.tap-hint{display:none;margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (hover:none){.tap-hint{display:inline}}
.groups{display:flex;flex-direction:column;gap:56px}
.group{display:flex;flex-direction:column;gap:20px}
.group-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.group-head h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.025em;text-wrap:balance}
.group-head p{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.meta h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.015em}
.meta p{margin:0;color:var(--muted);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding:16px 20px 20px;margin-top:auto}
.act{appearance:none;font:inherit;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;
  height:36px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;
  transition:background-color .15s,border-color .15s,color .15s}
.act svg{width:15px;height:15px;flex:none}
.act:hover{border-color:var(--muted)}
.act.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.act.primary:hover{opacity:.88}
.act.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.act.code{margin-left:auto}
.act[aria-expanded="true"]{border-color:var(--fg)}
.act:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.codebox{border-top:1px solid var(--line);background:var(--code-bg);min-width:0}
.tabs{display:flex;gap:4px;padding:10px 12px 0}
.tab{appearance:none;font:inherit;font-family:var(--mono);font-size:12px;letter-spacing:.04em;padding:6px 10px;border-radius:7px;border:0;
  background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
pre{margin:0;padding:14px 20px 20px;max-height:340px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--fg);tab-size:2}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;
  background:var(--toast-bg);color:var(--toast-fg);font-size:14px;font-weight:500;padding:10px 16px;border-radius:999px;
  pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.22,1,.36,1);max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

    <div class="pal-tools">

        <button type="button" class="act" id="copy-base"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg><span>Copy shared base</span></button>

<script>
/* ============================================================
   BUTTON REGISTRY — add new buttons by appending an entry.
   Each entry: no, name, cls (unique class), note, css, html.
   The shared BASE css and reduced-motion rule ship with every copy.
   ============================================================ */

/* Colors: every button reads these five variables. The picker changes them, and copies carry the chosen values. */
const PALETTE_DEFAULT = { ink:'#0A0A0A', paper:'#FFFFFF', accent:'#2F45FF', pop:'#D4FF3A', hot:'#EF4444', stage:'#EEEEEB' };
const PRESETS = [
  { name:'Default',  ...PALETTE_DEFAULT },
  { name:'Midnight', ink:'#0E1424', paper:'#F4F6FF', accent:'#7B61FF', pop:'#3FE0B0', hot:'#FF5D73', stage:'#DCE1F0' },
  { name:'Sunset',   ink:'#2A1410', paper:'#FFF8F1', accent:'#E8590C', pop:'#FFC93C', hot:'#D6336C', stage:'#F6E7DA' },
  { name:'Forest',   ink:'#102A1E', paper:'#F7FBF6', accent:'#1F7A4D', pop:'#C8F169', hot:'#E4572E', stage:'#E3ECE2' },
  { name:'Mono',     ink:'#111111', paper:'#FFFFFF', accent:'#444444', pop:'#DDDDDD', hot:'#888888', stage:'#F0F0F0' },
];
let palette = { ...PALETTE_DEFAULT };
try {
  const saved = JSON.parse(localStorage.getItem('button-lab-palette') || 'null');
  if (saved) for (const k in PALETTE_DEFAULT) if (/^#[0-9a-f]{6}$/i.test(saved[k] || '')) palette[k] = saved[k];
} catch (e) {}
function baseCSS(){
  return `:root {
  --cta-ink: ${palette.ink};
  --cta-paper: ${palette.paper};
  --cta-accent: ${palette.accent};
  --cta-pop: ${palette.pop};
  --cta-hot: ${palette.hot};
}
${BASE}`;
}

const BASE = `.cta {
  --out: cubic-bezier(.22, 1, .36, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  appearance: none; border: 0; margin: 0;
  font: inherit; font-size: 16px; font-weight: 500; letter-spacing: -0.01em;
  position: relative; display: inline-flex; align-items: center;
  box-sizing: border-box; white-space: nowrap;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.cta svg { display: block; flex: none; }
.cta:focus-visible { outline: 2px solid var(--cta-accent); outline-offset: 4px; }`;

const REDUCED = `@media (prefers-reduced-motion: reduce) {
  .cta, .cta *, .cta::before, .cta::after {
    transition-duration: .01ms !important; transition-delay: 0s !important; animation: none !important;
  }
}`;

const ARROW = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>`;
const ARROW_UR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg>`;

/* Sections: each button names its group (default 'dot'). */
const GROUPS = [
  { id:'dot', title:'Expanding Dot', note:'A small dot that grows into an arrow as the button wakes up. Quiet at rest, unmistakable on hover. Pure CSS.' },
  { id:'neu', title:'Pointer Follow', note:'Buttons that react to where the pointer is: lifting toward it, leaning into it, lighting up under it. A few lines of JavaScript drive the spring motion.' },
  { id:'wet', title:'Liquid & Paint', note:'Drips, sloshes, fizz and blobs. Buttons that look like they’re still wet. Pure CSS.' },
  { id:'marquee', title:'Moving Type', note:'Words in motion: endless marquees, tickers, slot-machine reels and text orbiting a badge. Pure CSS.' },
  { id:'encrypt', title:'Code & Security', note:'Scrambled labels, decryption, a typing terminal, falling glyphs and a passcode unlock. Light JavaScript for the text effects.' },
  { id:'click', title:'Click Feedback', note:'What a button does after it’s pressed: loading into success, ripples, confetti, hold-to-confirm and add-to-cart. Click them.' },
  { id:'burger', title:'Menu Toggles', note:'Menu icons that morph into an X, a back arrow or a dotted cross. Click to open and close; each sets its open state for screen readers.' },
  { id:'magnet', title:'Magnetic Physics', note:'Spring physics and pointer magnetism: buttons that drift, stare, stretch, swing on a string and swarm your cursor.' },
  { id:'dotted', title:'Dashed Lines', note:'The dashed border reimagined as a selection box, a ticket stub, a wireframe and a clip-out coupon. Pure CSS.' },
  { id:'glow', title:'Glow & Light', note:'Gradient halos, spinning light, aurora glass, a neon tube and a broadcast pulse. Made for dark backgrounds. Pure CSS.' },
  { id:'splash', title:'Splash & Ripple', note:'Water in every form: splashes, rain, paint splats, a reflection pool and ripples that roll across the surface.' },
  { id:'spot', title:'Spotlight', note:'A light that tracks the pointer across the button: revealing hidden messages, mixing colored beams, x-raying the inside and casting long shadows. Light JavaScript for the tracking.' },
  { id:'soft', title:'Soft UI', note:'Neumorphic buttons pressed out of the surface itself: soft shadows, a toggle that stays pushed in, a clicking dial, clay and embossed type. Best on a background that matches the button.' },
  { id:'brutal', title:'Neubrutalism', note:'Thick outlines, hard shadows and loud flat color: a stacked deck, a peeling sticker, a swinging price tag, a keycap, a rubber stamp, a ransom note and a button that begs you not to press it.' },
  { id:'fold', title:'Folds & Corners', note:'Paper-inspired buttons: dog-eared corners, a page that turns, a camera viewfinder, an envelope that opens, corners that fill in and a folded ribbon. Pure CSS.' },
  { id:'stars', title:'Stars & Sparkle', note:'Celestial buttons: stars that burst out on hover, a constellation that draws itself, shooting stars, a twinkling night sky and a click that goes supernova. Made for dark backgrounds.' },
  { id:'3d', title:'3D', note:'Real depth with CSS 3D transforms: a rolling cube, an extruded block, a flipping card, a split-flap departure board, an arcade button and a ringed planet. Pure CSS.' },
];

function boardHTML(from, to) {
  const tiles = [...from].map((c, i) => {
    const a = c === ' ' ? '&nbsp;' : c;
    const b = to[i] === ' ' ? '&nbsp;' : to[i];
    return `    <span class="tile" style="--d: ${i * 45}ms"><span class="cube"><span class="a">${a}</span><span class="b">${b}</span></span></span>`;
  }).join('\n');
  return `<button type="button" class="cta cta-board" aria-label="${from.charAt(0) + from.slice(1).toLowerCase()}">
  <span class="row" aria-hidden="true">
${tiles}
  </span>
</button>`;
}

const SPARKLE = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C12.6 6.6 17.4 11.4 24 12C17.4 12.6 12.6 17.4 12 24C11.4 17.4 6.6 12.6 0 12C6.6 11.4 11.4 6.6 12 0Z"></path></svg>`;

function setupNova(el) {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const boom = () => {
    el.classList.remove('boom');
    void el.offsetWidth;
    el.classList.add('boom');
    if (reduced) return;
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
      const dist = 60 + Math.random() * 50;
      const s = document.createElement('span');
      s.className = 'spark';
      s.style.cssText = `--dx: ${(Math.cos(a) * dist).toFixed(1)}px; --dy: ${(Math.sin(a) * dist * 0.7).toFixed(1)}px; --r: ${Math.round(Math.random() * 360)}deg; --w: ${Math.round(8 + Math.random() * 10)}px; --t: ${(0.6 + Math.random() * 0.4).toFixed(2)}s`;
      s.innerHTML = SPARKLE;
      s.addEventListener('animationend', () => s.remove());
      el.appendChild(s);
    }
  };
  el.addEventListener('click', boom);
  return () => el.removeEventListener('click', boom);
}

function ransomHTML(text) {
  const rot = [-8, 6, -4, 10, -12, 5, -6, 9, -3, 7, -10, 4, -5, 8];
  const ys = [-3, 2, -1, 3, -2, 1, 3, -3, 0, 2, -1, 1, -2, 2];
  const sizes = [18, 15, 20, 16, 19, 15, 17, 20, 16, 18, 15, 19, 17, 16];
  const tones = ['p', 'w', 'a', 'h'];
  const faces = ['', ' serif', ' mono'];
  const letters = [...text].map((c, i) => c === ' '
    ? '    <span class="gap"></span>'
    : `    <span class="l ${tones[i % 4]}${faces[i % 3]}" style="--r: ${rot[i % rot.length]}deg; --y: ${ys[i % ys.length]}px; --s: ${sizes[i % sizes.length]}px; --d: ${i * 25}ms">${c}</span>`).join('\n');
  return `<button type="button" class="cta cta-ransom" aria-label="${text.charAt(0) + text.slice(1).toLowerCase()}">
  <span class="word" aria-hidden="true">
${letters}
  </span>
</button>`;
}

function setupStamp(el) {
  let t = 0;
  const stamp = () => {
    el.classList.remove('stamped');
    void el.offsetWidth;
    el.classList.add('stamped');
    clearTimeout(t);
    t = setTimeout(() => el.classList.remove('stamped'), 2200);
  };
  el.addEventListener('click', stamp);
  return () => { clearTimeout(t); el.removeEventListener('click', stamp); };
}

function setupNag(el) {
  const label = el.querySelector('.msg');
  const lines = ['Do not press', 'Hey!', 'I said don’t.', 'Seriously?', 'Last warning…', 'Fine. Launching.'];
  let i = 0, t = 0;
  const nag = () => {
    i = (i + 1) % lines.length;
    label.textContent = lines[i];
    el.classList.toggle('done', i === lines.length - 1);
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
    clearTimeout(t);
    t = setTimeout(() => { i = 0; label.textContent = lines[0]; el.classList.remove('done'); }, 4000);
  };
  el.addEventListener('click', nag);
  return () => { clearTimeout(t); el.removeEventListener('click', nag); };
}

function setupPressToggle(el) {
  const toggle = () => {
    const on = !el.classList.contains('on');
    el.classList.toggle('on', on);
    el.setAttribute('aria-pressed', String(on));
  };
  el.addEventListener('click', toggle);
  return () => el.removeEventListener('click', toggle);
}

function setupDial(el) {
  const ticks = [...el.querySelectorAll('.ticks i')];
  const steps = ticks.length - 1;
  let level = 2;
  const render = () => {
    el.style.setProperty('--rot', `${-120 + (240 / steps) * level}deg`);
    ticks.forEach((t, i) => t.classList.toggle('lit', i <= level));
    el.setAttribute('aria-label', `Volume ${level} of ${steps}. Click to turn it up.`);
  };
  const turn = () => { level = (level + 1) % (steps + 1); render(); };
  render();
  el.addEventListener('click', turn);
  return () => el.removeEventListener('click', turn);
}

function setupSlideSpot(el) {
  const light = el.querySelector('.light');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const move = (e) => {
    const r = el.getBoundingClientRect();
    const left = `${((e.clientX - r.left) / r.width) * 100}%`;
    light.animate({ left }, { duration: reduced ? 0 : 250, fill: 'forwards' });
  };
  const leave = () => light.animate({ left: '50%' }, { duration: reduced ? 0 : 100, fill: 'forwards' });
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerleave', leave);
  return () => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerleave', leave); };
}

function setupFlashlight(el) {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const s = makeSpring((x, y) => { el.style.setProperty('--mx', `${x}px`); el.style.setProperty('--my', `${y}px`); }, 260, 26);
  const pos = (e) => { const r = el.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const enter = (e) => s.jump(...pos(e));
  const move = (e) => (reduced ? s.jump(...pos(e)) : s.set(...pos(e)));
  el.addEventListener('pointerenter', enter);
  el.addEventListener('pointermove', move);
  return () => { s.stop(); el.removeEventListener('pointerenter', enter); el.removeEventListener('pointermove', move); };
}

function setupRgbBeams(el) {
  const beams = [...el.querySelectorAll('.beams i')];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const springs = beams.map((b, i) => makeSpring((x, y) => { b.style.transform = `translate(${x}px, ${y}px)`; }, [320, 140, 70][i], [26, 18, 13][i]));
  const rest = () => {
    const w = el.offsetWidth, h = el.offsetHeight;
    springs.forEach((s, i) => s.set(w / 2 + [-34, 0, 34][i], h / 2 + [6, -6, 6][i]));
  };
  const w0 = el.offsetWidth, h0 = el.offsetHeight;
  springs.forEach((s, i) => s.jump(w0 / 2 + [-34, 0, 34][i], h0 / 2 + [6, -6, 6][i]));
  const move = (e) => {
    const r = el.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    springs.forEach((s) => (reduced ? s.jump(x, y) : s.set(x, y)));
  };
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerleave', rest);
  return () => { springs.forEach((s) => s.stop()); el.removeEventListener('pointermove', move); el.removeEventListener('pointerleave', rest); };
}

function setupXray(el) {
  const move = (e) => {
    const r = el.getBoundingClientRect();
    el.style.setProperty('--mx', `${e.clientX - r.left}px`);
    el.style.setProperty('--my', `${e.clientY - r.top}px`);

}

function setupLongShadow(el) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const field = el.parentElement;
  const STEPS = 14;
  const paint = (dx, dy) => {
    const parts = [];
    for (let i = 1; i <= STEPS; i++) {
      const mix = Math.round(100 - (i / STEPS) * 70);
      parts.push(`${(dx * i).toFixed(2)}px ${(dy * i).toFixed(2)}px 0 color-mix(in srgb, var(--cta-accent) ${mix}%, var(--cta-pop))`);
    }
    el.style.textShadow = parts.join(', ');
  };
  const s = makeSpring(paint, 200, 20);
  s.jump(0.71, 0.71);
  const move = (e) => {
    if (e.pointerType !== 'mouse') return;
    const r = el.getBoundingClientRect();
    const dx = r.left + r.width / 2 - e.clientX;
    const dy = r.top + r.height / 2 - e.clientY;
    const d = Math.hypot(dx, dy) || 1;
    s.set(dx / d, dy / d);
  };
  const leave = () => s.set(0.71, 0.71);
  field.addEventListener('pointermove', move);
  field.addEventListener('pointerleave', leave);
  return () => { s.stop(); field.removeEventListener('pointermove', move); field.removeEventListener('pointerleave', leave); };
}

function setupSplashdown(el) {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fire = (x, y) => {
    el.classList.remove('squish');
    void el.offsetWidth;
    el.classList.add('squish');
    if (reduced) return;
    const wave = document.createElement('span');
    wave.className = 'wave';
    wave.style.cssText = `left: ${x}px; top: ${y}px`;
    wave.addEventListener('animationend', () => wave.remove());
    el.appendChild(wave);
    for (let i = 0; i < 12; i++) {
      const a = -Math.PI / 2 + (i / 11 - 0.5) * Math.PI * 1.4 + (Math.random() - 0.5) * 0.25;
      const dist = 34 + Math.random() * 40;
      const dx = Math.cos(a) * dist;
      const dy = Math.sin(a) * dist;
      const drop = document.createElement('span');
      drop.className = 'drop';
      drop.style.cssText = `left: ${x}px; top: ${y}px; --dx: ${dx.toFixed(1)}px; --dy: ${dy.toFixed(1)}px; --dy2: ${(dy + 64).toFixed(1)}px; --r: ${Math.round(a * 180 / Math.PI + 90)}deg; --t: ${(0.6 + Math.random() * 0.3).toFixed(2)}s`;
      drop.addEventListener('animationend', () => drop.remove());
      el.appendChild(drop);
    }
  };
  const down = (e) => { const r = el.getBoundingClientRect(); fire(e.clientX - r.left, e.clientY - r.top); };
  const key = (e) => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) fire(el.offsetWidth / 2, el.offsetHeight / 2); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('keydown', key);
  return () => { el.removeEventListener('pointerdown', down); el.removeEventListener('keydown', key); };
}

function setupPuddle(el) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let rain = 0, last = 0;
  const drop = (x, y, big) => {
    const r = document.createElement('span');
    r.className = big ? 'rp big' : 'rp';
    r.style.cssText = `left: ${x}px; top: ${y}px`;
    r.addEventListener('animationend', () => r.remove());
    el.appendChild(r);
  };
  const start = () => {
    clearInterval(rain);
    rain = setInterval(() => drop(Math.random() * el.offsetWidth, Math.random() * el.offsetHeight, false), 180);
  };
  const stop = () => clearInterval(rain);
  const move = (e) => {
    const now = performance.now();
    if (now - last < 110) return;
    last = now;
    const r = el.getBoundingClientRect();
    drop(e.clientX - r.left, e.clientY - r.top, true);
  };
  el.addEventListener('pointerenter', start);
  el.addEventListener('focus', start);
  el.addEventListener('pointerleave', stop);
  el.addEventListener('blur', stop);
  el.addEventListener('pointermove', move);
  return () => {
    stop();
    el.removeEventListener('pointerenter', start);
    el.removeEventListener('focus', start);
    el.removeEventListener('pointerleave', stop);
    el.removeEventListener('blur', stop);
    el.removeEventListener('pointermove', move);
  };
}

function setupSkip(el) {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const skip = (x, y) => {
    const w = el.offsetWidth;
    const dir = x < w / 2 ? 1 : -1;
    const hops = reduced ? 1 : 4;
    for (let i = 0; i < hops; i++) {
      const hx = x + dir * i * w * 0.2;
      const hy = y + (i % 2 ? -4 : 3);
      const k = 1 - i * 0.2;
      [0, 0.12].forEach((extra) => {
        const ring = document.createElement('span');
        ring.className = 'ring';
        ring.style.cssText = `left: ${hx.toFixed(1)}px; top: ${hy.toFixed(1)}px; --k: ${k.toFixed(2)}; --d: ${(i * 0.17 + extra).toFixed(2)}s`;
        ring.addEventListener('animationend', () => ring.remove());
        el.appendChild(ring);
      });
    }
  };
  const down = (e) => { const r = el.getBoundingClientRect(); skip(e.clientX - r.left, e.clientY - r.top); };
  const key = (e) => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) skip(el.offsetWidth * 0.18, el.offsetHeight / 2); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('keydown', key);
  return () => { el.removeEventListener('pointerdown', down); el.removeEventListener('keydown', key); };
}

function setupWaveField(el) {
  const field = el.querySelector('.field');
  const COLS = 20, ROWS = 4;
  field.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
  field.innerHTML = '<i></i>'.repeat(COLS * ROWS);
  const dots = [...field.children];
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let pos = null, sources = [], raf = 0, last = 0;
  const measure = () => { pos = dots.map((d) => [d.offsetLeft + d.offsetWidth / 2, d.offsetTop + d.offsetHeight / 2]); };
  const frame = (now) => {
    sources = sources.filter((s) => now - s.t0 < 1500);
    dots.forEach((d, i) => {
      let amp = 0;
      sources.forEach((s) => {
        const age = (now - s.t0) / 1000;
        const front = age * 170;
        const dist = Math.hypot(pos[i][0] - s.x, pos[i][1] - s.y);
        amp += s.a * Math.exp(-((dist - front) ** 2) / 200) * Math.max(0, 1 - age / 1.5);
      });
      d.style.transform = amp > 0.01 ? `scale(${(1 + amp * 1.8).toFixed(2)})` : '';
      d.style.opacity = amp > 0.01 ? (0.3 + Math.min(1, amp) * 0.7).toFixed(2) : '';
    });
    raf = sources.length ? requestAnimationFrame(frame) : 0;
  };
  const add = (e, a) => {
    if (!pos) measure();
    const r = field.getBoundingClientRect();
    sources.push({ x: e.clientX - r.left, y: e.clientY - r.top, t0: performance.now(), a });
    if (!raf) raf = requestAnimationFrame(frame);
  };
  const down = (e) => add(e, 1);
  const move = (e) => {
    if (e.pointerType !== 'mouse') return;
    const now = performance.now();
    if (now - last < 260) return;
    last = now;
    add(e, 0.45);
  };
  const key = (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) {
      const r = field.getBoundingClientRect();
      add({ clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 }, 1);
    }
  };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointermove', move);
  el.addEventListener('keydown', key);
  return () => {
    cancelAnimationFrame(raf);
    el.removeEventListener('pointerdown', down);
    el.removeEventListener('pointermove', move);
    el.removeEventListener('keydown', key);
  };
}

function setupSplat(el) {
  const COLORS = ['var(--cta-accent)', 'var(--cta-pop)', 'var(--cta-hot)'];
  let n = 0;
  const shape = () => {
    const pts = [];
    const N = 14;
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      const r = i % 2 ? 22 + Math.random() * 8 : 32 + Math.random() * 14;
      pts.push([60 + Math.cos(a) * r, 60 + Math.sin(a) * r]);
    }
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    const f = (v) => v.toFixed(1);
    let m = mid(pts[N - 1], pts[0]);
    let d = `M${f(m[0])},${f(m[1])}`;
    for (let i = 0; i < N; i++) {
      const q = pts[i];
      const nm = mid(pts[i], pts[(i + 1) % N]);
      d += ` Q${f(q[0])},${f(q[1])} ${f(nm[0])},${f(nm[1])}`;
    }
    let drops = '';
    for (let i = 0; i < 4; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 46 + Math.random() * 10;
      drops += `<circle cx="${f(60 + Math.cos(a) * r)}" cy="${f(60 + Math.sin(a) * r)}" r="${f(2 + Math.random() * 3)}"></circle>`;
    }
    return `<path d="${d}"></path>${drops}`;
  };
  const splat = (x, y) => {
    const s = document.createElement('span');
    s.className = 'splat';
    s.style.cssText = `left: ${x}px; top: ${y}px; --c: ${COLORS[n++ % COLORS.length]}; --rot: ${Math.round(Math.random() * 360)}deg`;
    s.innerHTML = `<svg viewBox="0 0 120 120" aria-hidden="true">${shape()}</svg>`;
    el.appendChild(s);
    const live = el.querySelectorAll('.splat:not(.out)');
    if (live.length > 3) {
      const old = live[0];
      old.classList.add('out');
      old.addEventListener('animationend', () => old.remove());
    }
  };
  const down = (e) => { const r = el.getBoundingClientRect(); splat(e.clientX - r.left, e.clientY - r.top); };
  const key = (e) => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) splat(el.offsetWidth / 2, el.offsetHeight / 2); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('keydown', key);
  return () => { el.removeEventListener('pointerdown', down); el.removeEventListener('keydown', key); };
}

function setupMagnet(el) {
  // Unique path id so several magnets can share a page.
  const path = el.querySelector('.circle-path');
  const id = 'cta-magnet-' + Math.random().toString(36).slice(2, 8);
  path.id = id;
  el.querySelector('textPath').setAttribute('href', '#' + id);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let cx = 0, cy = 0;
  const s = makeSpring((x, y) => { cx = x; cy = y; el.style.transform = `translate(${x}px, ${y}px)`; }, 400, 50, 3);
  const move = (e) => {
    if (e.pointerType !== 'mouse') return;
    const r = el.getBoundingClientRect();
    const ox = r.left - cx + r.width / 2;
    const oy = r.top - cy + r.height / 2;
    s.set((e.clientX - ox) / 2, (e.clientY - oy) / 2);
  };
  const leave = () => s.set(0, 0);
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerleave', leave);
  return () => { s.stop(); el.removeEventListener('pointermove', move); el.removeEventListener('pointerleave', leave); };
}

function setupWatcher(el) {
  const eyes = [...el.querySelectorAll('.eye')];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const look = (e) => {
    eyes.forEach((eye) => {
      const r = eye.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2);
      const dy = e.clientY - (r.top + r.height / 2);
      const d = Math.hypot(dx, dy) || 1;
      const m = Math.min(4, d / 12);
      eye.firstElementChild.style.transform = `translate(${(dx / d) * m}px, ${(dy / d) * m}px)`;
    });
  };
  const rest = () => eyes.forEach((eye) => { eye.firstElementChild.style.transform = ''; });
  let blinkT = 0;
  const blink = () => {
    el.classList.add('blink');
    setTimeout(() => el.classList.remove('blink'), 140);
    blinkT = setTimeout(blink, 2500 + Math.random() * 3000);
  };
  if (!reduced) blinkT = setTimeout(blink, 1800);
  window.addEventListener('pointermove', look);
  document.documentElement.addEventListener('pointerleave', rest);
  return () => {
    clearTimeout(blinkT);
    window.removeEventListener('pointermove', look);
    document.documentElement.removeEventListener('pointerleave', rest);
  };
}

function setupStretch(el) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const field = el.parentElement;
  const skin = el.querySelector('.skin');
  const label = el.querySelector('.lbl');
  const s = makeSpring((x, y) => {
    const d = Math.hypot(x, y);
    const a = Math.atan2(y, x);
    const k = 1 + Math.min(d, 70) / 170;
    skin.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px) rotate(${a}rad) scale(${k}, ${1 / k}) rotate(${-a}rad)`;
    label.style.transform = `translate(${x * 0.14}px, ${y * 0.14}px)`;
  }, 260, 9);
  const move = (e) => {
    if (e.pointerType !== 'mouse') return;
    const r = field.getBoundingClientRect();
    s.set(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
  };
  const leave = () => s.set(0, 0);
  field.addEventListener('pointermove', move);
  field.addEventListener('pointerleave', leave);
  return () => { s.stop(); field.removeEventListener('pointermove', move); field.removeEventListener('pointerleave', leave); };
}

function setupFilings(el) {
  const field = el.querySelector('.field');
  const COLS = 11, ROWS = 3;
  field.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
  field.innerHTML = '<i></i>'.repeat(COLS * ROWS);
  const ticks = [...field.children];
  let raf = 0, px = 0, py = 0;
  const paint = () => {
    raf = 0;
    ticks.forEach((t) => {
      const r = t.getBoundingClientRect();
      const dx = px - (r.left + r.width / 2);
      const dy = py - (r.top + r.height / 2);
      const d = Math.hypot(dx, dy);

/* Shared spring for pointer-driven buttons. Copied along with any button that uses it. */
function makeSpring(apply, stiffness = 170, damping = 26, mass = 1) {
  let x = 0, y = 0, vx = 0, vy = 0, tx = 0, ty = 0, raf = 0, last = 0;
  const tick = (now) => {
    let left = Math.min((now - last) / 1000, 0.05);
    last = now;
    while (left > 0) {
      const h = Math.min(left, 1 / 240);
      vx += ((-stiffness * (x - tx) - damping * vx) / mass) * h;
      vy += ((-stiffness * (y - ty) - damping * vy) / mass) * h;
      x += vx * h; y += vy * h; left -= h;
    }
    if (Math.abs(x - tx) + Math.abs(y - ty) + Math.abs(vx) + Math.abs(vy) < 0.01) {
      x = tx; y = ty; vx = vy = 0; raf = 0; apply(x, y); return;
    }
    apply(x, y);
    raf = requestAnimationFrame(tick);
  };
  return {
    set(nx, ny) { tx = nx; ty = ny; if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } },
    jump(nx, ny) { x = tx = nx; y = ty = ny; vx = vy = 0; apply(x, y); },
    stop() { cancelAnimationFrame(raf); raf = 0; },
  };
}

    el.style.setProperty('--mx', `${x}px`);
    el.style.setProperty('--my', `${y}px`);
  }, 300, 30);
  const pos = (e) => {
    const r = el.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  };
  const enter = (e) => s.jump(...pos(e));
  const move = (e) => (reduced ? s.jump(...pos(e)) : s.set(...pos(e)));
  const leave = () => { const r = el.getBoundingClientRect(); s.set(r.width / 2, r.height / 2); };
  el.addEventListener('pointerenter', enter);
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerleave', leave);
  return () => {
    s.stop();
    el.removeEventListener('pointerenter', enter);
    el.removeEventListener('pointermove', move);
    el.removeEventListener('pointerleave', leave);
  };
}

function setupTilt(el) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const stage = el.parentElement;
  const s = makeSpring((x, y) => {
    el.style.setProperty('--ry', `${(x * 18).toFixed(2)}deg`);
    el.style.setProperty('--rx', `${(-y * 14).toFixed(2)}deg`);
    el.style.setProperty('--sx', `${(-x * 12).toFixed(2)}px`);
    el.style.setProperty('--sy', `${(6 - y * 8).toFixed(2)}px`);
  }, 260, 22);
  const move = (e) => {
    if (e.pointerType !== 'mouse') return;
    const r = stage.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    s.set(x, y);
    el.style.setProperty('--gx', `${(x + 0.5) * 100}%`);
    el.style.setProperty('--gy', `${(y + 0.5) * 100}%`);
  };
  const leave = () => s.set(0, 0);
  stage.addEventListener('pointermove', move);
  stage.addEventListener('pointerleave', leave);
  return () => {
    s.stop();
    stage.removeEventListener('pointermove', move);
    stage.removeEventListener('pointerleave', leave);
  };
}

function setupLightSource(el) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const field = el.parentElement;
  const needle = el.querySelector('.needle svg');
  let target = 0;
  const shadow = makeSpring((x, y) => {
    el.style.setProperty('--sx', `${x.toFixed(2)}px`);
    el.style.setProperty('--sy', `${y.toFixed(2)}px`);
  }, 240, 20);
  const turn = makeSpring((a) => { needle.style.transform = `rotate(${a}deg)`; }, 200, 16);
  shadow.jump(6, 6);
  const aim = (a) => {
    while (a - target > 180) a -= 360;
    while (a - target < -180) a += 360;
    target = a;
    turn.set(a, 0);
  };
  const move = (e) => {
    if (e.pointerType !== 'mouse') return;
    const r = field.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy) || 1;
    const len = Math.min(12, 4 + d / 16);
    shadow.set((-dx / d) * len, (-dy / d) * len);
    const n = needle.parentElement.getBoundingClientRect();
    aim(Math.atan2(e.clientY - (n.top + n.height / 2), e.clientX - (n.left + n.width / 2)) * 180 / Math.PI);
  };
  const leave = () => { shadow.set(6, 6); aim(0); };
  field.addEventListener('pointermove', move);
  field.addEventListener('pointerleave', leave);
  return () => {
    shadow.stop(); turn.stop();
    field.removeEventListener('pointermove', move);
    field.removeEventListener('pointerleave', leave);
  };
}

function cascadeHTML(text){
  const chars = [...text].map(c => {
    const ch = c === ' ' ? '&nbsp;' : c;
    return `    <span class="ch"><span>${ch}</span><span>${ch}</span></span>`;
  }).join('\n');
  return `<button type="button" class="cta cta-letter-cascade" aria-label="${text}">
  <span class="word" aria-hidden="true">
${chars}
  </span>
  <span class="tail" aria-hidden="true">${ARROW}</span>
</button>`;
}
function cascadeDelays(n){
  let s = '';
  for (let i = 2; i <= n; i++) s += `\n.cta-letter-cascade .ch:nth-child(${i}) span { transition-delay: ${(i - 1) * 18}ms; }`;
  return s;
}

   ============================================================ */
function scriptParts(b){
  if (!b.setup) return '';
  const src = b.setup.toString();
  return (includeBase && src.includes('makeSpring') ? makeSpring.toString() + '\n\n' : '') + src;
}
let includeBase = true;
try { includeBase = localStorage.getItem('button-lab-include-base') !== 'off'; } catch (e) {}
function cssFor(b){
  return includeBase ? `${baseCSS()}\n\n${b.css}\n\n${REDUCED}` : b.css;
}
function sharedBase(){
  return `<!-- Button Lab shared base: paste once per page, then copy buttons with "Include shared base" turned off -->\n<style>\n${baseCSS()}\n\n${REDUCED}\n</style>\n\n<script>\n${makeSpring.toString()}\n<\/script>\n`;
}
function htmlSnippet(b){
  let out = `<style>\n${cssFor(b)}\n</style>\n\n${b.html}\n`;
  if (b.setup) out += `\n<script>\n${scriptParts(b)}\n\ndocument.querySelectorAll('.${b.cls}').forEach(${b.setup.name});\n<\/script>\n`;
  return out;
}

const ATTR_MAP = { class:'className', for:'htmlFor', tabindex:'tabIndex', crossorigin:'crossOrigin' };
function jsxAttr(name){
  if (ATTR_MAP[name]) return ATTR_MAP[name];
  if (name.startsWith('aria-') || name.startsWith('data-')) return name;
  return name.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
}
function jsxText(t){
  return t.replace(/\u00a0/g, '{"\\u00a0"}').replace(/[{}<>]/g, c => `{"${c}"}`);
}
function toJSX(node, depth){
  const ind = '  '.repeat(depth);
  if (node.nodeType === 3){
    const t = node.textContent;
    if (!t.replace(/[ \t\n\r]/g, '')) return '';
    return ind + jsxText(t.trim() || t);
  }
  if (node.nodeType !== 1) return '';
  const tag = node.localName;
  const attrs = [...node.attributes].map(a => {
    if (a.name === 'style') {
      const obj = {};
      a.value.split(';').map(d => d.trim()).filter(Boolean).forEach(d => {
        const i = d.indexOf(':');
        const k = d.slice(0, i).trim();
        obj[k.startsWith('--') ? k : k.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = d.slice(i + 1).trim();
      });
      return ` style={${JSON.stringify(obj).replace(/":"/g, '": "').replace(/","/g, '", "')}}`;
    }
    return ` ${jsxAttr(a.name)}="${a.value}"`;
  }).join('');
  const kids = [...node.childNodes].filter(n => n.nodeType === 1 || (n.nodeType === 3 && n.textContent.replace(/[ \t\n\r]/g, '')));
  if (!kids.length) return `${ind}<${tag}${attrs} />`;
  if (kids.length === 1 && kids[0].nodeType === 3) return `${ind}<${tag}${attrs}>${jsxText(kids[0].textContent)}</${tag}>`;
  const inner = kids.map(k => toJSX(k, depth + 1)).filter(Boolean).join('\n');
  return `${ind}<${tag}${attrs}>\n${inner}\n${ind}</${tag}>`;
}
function reactSnippet(b){
  const tpl = document.createElement('template');
  tpl.innerHTML = b.html.trim();
  let jsx = [...tpl.content.childNodes].filter(n => n.nodeType === 1).map(n => toJSX(n, 2)).join('\n');
  const comp = b.name.replace(/[^A-Za-z0-9 ]/g, '').split(' ').map(w => w[0].toUpperCase() + w.slice(1)).join('') + 'Button';
  const css = cssFor(b).replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$\{/g, '\\${');
  if (b.setup){
    jsx = jsx.replace(`className="cta ${b.cls}"`, `ref={ref} className="cta ${b.cls}"`);
    return `import React, { useEffect, useRef } from "react";

const css = \`
${css}
\`;

${scriptParts(b)}

export default function ${comp}() {
  const ref = useRef(null);
  useEffect(() => ${b.setup.name}(ref.current), []);

  return (
    <>
      <style>{css}</style>
${jsx}
    </>
  );
}
`;
  }
  return `import React from "react";

const css = \`
${css}
\`;

export default function ${comp}() {
  return (
    <>
      <style>{css}</style>
${jsx}
    </>
  );
}
`;
}

/* Randomizer: builds a harmonious palette around one base hue, keeping any locked colors. */
function hslHex(h, sat, l) {
  h = ((h % 360) + 360) % 360; sat /= 100; l /= 100;
  const k = (n) => (n + h / 30) % 12;
  const a = sat * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return '#' + [f(0), f(8), f(4)].map((x) => Math.round(x * 255).toString(16).padStart(2, '0')).join('').toUpperCase();
}
function hexHue(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  if (!d) return Math.random() * 360;
  const h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return (h * 60 + 360) % 360;
}
function randomPalette() {
  const rnd = (a, b) => a + Math.random() * (b - a);
  const base = locks.accent ? hexHue(palette.accent) : rnd(0, 360);
  const next = {
    ink: hslHex(base + rnd(-25, 25), rnd(18, 45), rnd(7, 12)),
    paper: hslHex(base + rnd(-20, 20), rnd(20, 45), rnd(96, 99)),
    accent: hslHex(base, rnd(65, 92), rnd(44, 54)),
    pop: hslHex(base + rnd(110, 200), rnd(78, 96), rnd(58, 68)),
    hot: hslHex(base + (Math.random() < .5 ? rnd(-80, -40) : rnd(140, 190)), rnd(70, 88), rnd(52, 60)),
    stage: hslHex(base + rnd(-15, 15), rnd(10, 22), rnd(88, 93)),
  };
  for (const k in next) if (!locks[k]) palette[k] = next[k];
}

function copyText(text){

    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
    }
  } catch (e) {}

}
function legacyCopy(text){

    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.top = '0';
    document.body.appendChild(ta); ta.select();

  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400);
}
</script>
